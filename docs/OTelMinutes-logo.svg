<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 9 746.14 140">
  <defs>
    <style>
      .brand { color: #dc9e10; }
      .text-base {         
        font-family: &quot;Segoe UI&quot;, &quot;Roboto&quot;, sans-serif;
        font-size: 120px;
        fill: currentColor;
      }
      .text-otel { font-weight: 600; }
      .text-minutes { font-weight: 400; }
      .metric-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .metric-node {
        fill: none;
        stroke: currentColor;
        stroke-width: 6;
      }
    </style>
<!--Define the metric M as a self-contained symbol so mask + geometry scale together-->
    <symbol id="metric-m" viewBox="0 0 200 200" overflow="visible">
      <mask id="cut-nodes-m" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
        <rect x="0" y="0" width="200" height="200" fill="white"/>
<!--Slightly smaller than node radius so the line visually meets the ring-->
        <circle cx="30" cy="170" r="11" fill="black"/>
        <circle cx="30" cy="30" r="11" fill="black"/>
        <circle cx="100" cy="120" r="11" fill="black"/>
        <circle cx="170" cy="30" r="11" fill="black"/>
        <circle cx="170" cy="170" r="11" fill="black"/>
      </mask>
      <polyline class="metric-line" mask="url(#cut-nodes-m)" points="30,170 30,30 100,120 170,30 170,170"/>
      <circle class="metric-node" cx="30" cy="170" r="14"/>
      <circle class="metric-node" cx="30" cy="30" r="14"/>
      <circle class="metric-node" cx="100" cy="120" r="14"/>
      <circle class="metric-node" cx="170" cy="30" r="14"/>
      <circle class="metric-node" cx="170" cy="170" r="14"/>
    </symbol>
  </defs>
  <g class="brand">
    <!--"OTel"-->
    <text x="40" y="120" class="text-base text-otel">OTel</text>
    <!--Custom M (now reliably masked + scaled)-->
    <use href="#metric-m" x="330" y="10" width="140" height="140"/>
    <!--"inutes"-->
    <text x="460" y="120" class="text-base text-minutes">inutes</text>
  </g>
</svg>
