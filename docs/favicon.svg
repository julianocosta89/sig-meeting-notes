<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">

  <defs>
    <!-- Mask that removes circular areas from the line -->
    <mask id="cut-nodes">
      <!-- Everything visible by default -->
      <rect x="0" y="0" width="100%" height="100%" fill="white"></rect>
      
      <!-- Black circles = areas removed from the line -->
      <circle cx="30" cy="170" r="12" fill="black"></circle>
      <circle cx="30" cy="30" r="12" fill="black"></circle>
      <circle cx="100" cy="120" r="12" fill="black"></circle>
      <circle cx="170" cy="30" r="12" fill="black"></circle>
      <circle cx="170" cy="170" r="12" fill="black"></circle>
    </mask>

    <style>
      .metric-line {
        fill: none;
        stroke: #dc9e10;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .metric-node {
        fill: none;              /* fully transparent */
        stroke: #dc9e10;
        stroke-width: 5;
      }
    </style>
  </defs>

  <!-- Line with circular cutouts -->
  <polyline class="metric-line" mask="url(#cut-nodes)" points="30,170 30,30 100,120 170,30 170,170"></polyline>

  <!-- Transparent node outlines -->
  <circle class="metric-node" cx="30" cy="170" r="12"></circle>
  <circle class="metric-node" cx="30" cy="30" r="12"></circle>
  <circle class="metric-node" cx="100" cy="120" r="12"></circle>
  <circle class="metric-node" cx="170" cy="30" r="12"></circle>
  <circle class="metric-node" cx="170" cy="170" r="12"></circle>

</svg>