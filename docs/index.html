<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTelemetry SIG Meeting Notes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem('otel-notes-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <h1>OpenTelemetry SIG Meeting Notes</h1>
    <div class="header-actions">
      <a
        href="https://github.com/julianocosta89/sig-meeting-notes"
        class="header-icon-btn"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
        title="View source on GitHub"
      ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      <button
        type="button"
        id="theme-toggle"
        class="header-icon-btn"
        aria-label="Switch to light mode"
        title="Switch to light mode"
      ></button>
    </div>
  </header>

  <main id="main" class="layout">
    <button
      id="sidebar-toggle"
      type="button"
      class="sidebar-toggle"
      aria-label="Toggle navigation"
      aria-expanded="true"
      hidden
    >&#9776; Navigation</button>
    <aside class="sidebar" aria-label="Navigation">
      <div class="controls">
        <div class="control-group">
          <label for="global-search-input" class="sr-only">Search all transcripts</label>
          <input
            id="global-search-input"
            type="search"
            placeholder="Search all transcripts..."
            aria-label="Search all transcripts"
          >
        </div>

        <div class="control-group">
          <div id="date-range-row" role="button" tabindex="0" aria-label="Date range filter" aria-haspopup="dialog" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="date-range-label">last two weeks</span>
          </div>
          <div id="calendar-popup" role="dialog" aria-label="Select date range" aria-modal="true" hidden>
            <div class="cal-header">
              <button id="cal-prev" aria-label="Previous month">‹</button>
              <span id="cal-month-label"></span>
              <button id="cal-next" aria-label="Next month">›</button>
            </div>
            <div id="cal-grid" class="cal-grid" role="grid" aria-label="Calendar"></div>
            <div class="cal-footer">
              <button id="cal-reset">Reset to last two weeks</button>
            </div>
          </div>
        </div>

        <div class="control-group">
          <label for="sig-select">SIG</label>
          <select id="sig-select">
            <option value="">Choose a SIG...</option>
          </select>
        </div>

        <div class="control-group search-group" hidden>
          <label for="search-input" class="sr-only">Search SIG transcripts</label>
          <input
            id="search-input"
            type="search"
            placeholder="Search SIG transcripts..."
            aria-label="Search SIG transcripts"
          >
        </div>

        <div class="search-nav" hidden>
          <span class="match-counter" aria-live="polite">0 / 0 matches</span>
          <div class="search-nav-buttons">
            <button type="button" class="search-nav-btn" id="prev-match-btn" aria-label="Previous match" title="Previous match">&#9650;</button>
            <button type="button" class="search-nav-btn" id="next-match-btn" aria-label="Next match (Ctrl+G)" title="Next match (Ctrl+G)">&#9660;</button>
          </div>
        </div>
      </div>

      <div class="date-nav-wrapper" hidden>
        <nav class="date-nav" aria-label="Meeting dates">
          <ul id="date-list" class="date-list" role="list">
          </ul>
        </nav>
      </div>
    </aside>

    <div id="transcript-panel" class="transcript-panel" role="region" aria-label="Meeting transcript" aria-live="polite">
      <div class="empty-state">
        <p>Select a SIG to browse its meeting transcripts.</p>
      </div>
    </div>
  </main>

  <button
    id="scroll-top-btn"
    type="button"
    class="scroll-top-btn"
    aria-label="Scroll to top"
    hidden
  >&#8593;</button>

  <script type="module" src="app.js"></script>
</body>
</html>
