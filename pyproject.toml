[project]
name = "otel-recordings"
version = "0.1.0"
description = "Fetch OpenTelemetry SIG meeting transcripts from Zoom recordings"
requires-python = ">=3.14"
dependencies = [
    "playwright==1.58.0",
    "beautifulsoup4==4.14.3",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.5",
    "pre-commit==4.5.1",
    "pip-audit==2.10.0",
]
summarize = ["openai==2.24.0", "jinja2==3.1.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/test_community.py" = ["E501"]  # markdown table fixture strings cannot be split
"tests/*.py" = ["S101", "S105", "S603", "S607"]  # assert is idiomatic in pytest; S105 false-positives on token/name equality checks; subprocess in test fixtures is trusted
"scraper/speaker_boundaries.py" = ["S105"]  # regex pattern constants, not passwords

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
