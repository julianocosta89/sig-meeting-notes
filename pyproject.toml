[project]
name = "otel-recordings"
version = "0.2.0"
description = "Fetch OpenTelemetry SIG meeting transcripts from Zoom recordings"
requires-python = ">=3.14"
dependencies = [
    "playwright==1.65.1",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1",
]
summarize = ["anthropic==2.7.0", "jinja2==3.1.6"]
telemetry = [
    "opentelemetry-distro==0.66b2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/test_community.py" = ["E501"]  # markdown table fixture strings cannot be split
"tests/*.py" = ["S101", "S105", "S603", "S607"]  # assert is idiomatic in pytest; S105 false-positives on token/name equality checks; subprocess in test fixtures is trusted
"scraper/speaker_boundaries.py" = ["S105"]  # regex pattern constants, not passwords

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
