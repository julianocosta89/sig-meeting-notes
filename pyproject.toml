[project]
name = "otel-recordings"
version = "0.2.0"
description = "Fetch OpenTelemetry SIG meeting transcripts from Zoom recordings"
requires-python = ">=3.14"
dependencies = [
    "playwright==1.59.0",
    "beautifulsoup4==4.14.3",
    "requests==2.34.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "pre-commit==4.6.0",
    "pip-audit==2.10.0",
]
summarize = ["openai==2.36.0", "jinja2==3.1.6"]
telemetry = [
    "opentelemetry-distro==0.62b1",
    "opentelemetry-exporter-otlp-proto-http==1.41.1",
    "opentelemetry-instrumentation-logging==0.62b1",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    "opentelemetry-instrumentation-requests==0.62b1",
    # opentelemetry-instrumentation-openai-v2 calls wrap_function_wrapper(module=...) using
    # the wrapt 1.x keyword name; wrapt 2.x renamed it to `target=`, breaking instrumentation.
    # Pin to 1.x until upstream fixes the kwarg name.
    "wrapt==1.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/test_community.py" = ["E501"]  # markdown table fixture strings cannot be split
"tests/*.py" = ["S101", "S105", "S603", "S607"]  # assert is idiomatic in pytest; S105 false-positives on token/name equality checks; subprocess in test fixtures is trusted
"scraper/speaker_boundaries.py" = ["S105"]  # regex pattern constants, not passwords

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
