[project]
name = "otel-recordings"
version = "0.1.0"
description = "Fetch OpenTelemetry SIG meeting transcripts from Zoom recordings"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.58",
    "beautifulsoup4>=4.14",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.3", "pytest-cov>=7.0"]
summarize = ["openai>=2.24", "jinja2>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
