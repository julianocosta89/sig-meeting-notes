name: Daily Digest

on:
  workflow_run:
    workflows: ["Generate Summaries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      summarize_commit_sha:
        description: "Commit SHA written by the summarize workflow (leave blank to diff HEAD~1..HEAD)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read      # needed to download artifacts from the triggering workflow run

concurrency:
  group: "digest"
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0          # full history so SUMMARIZE_COMMIT_SHA~1 is always reachable for git diff

      - name: Download summary commit SHA artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: summarize-commit-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read summary commit SHA
        id: read-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.summarize_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA=$(cat summarize-commit-sha.txt 2>/dev/null | tr -d '[:space:]')
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DISPATCH_SHA" ]; then
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize --group telemetry

      - name: Send daily digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRIVATE_EMAIL: ${{ secrets.PRIVATE_EMAIL }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # SHA of the exact commit summarize pushed (empty if nothing was pushed).
          # found=true means this is a workflow_run trigger; found=false means workflow_dispatch.
          SUMMARIZE_COMMIT_SHA: ${{ steps.read-sha.outputs.sha }}
          SUMMARIZE_COMMIT_FOUND: ${{ steps.read-sha.outputs.found }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=${{ secrets.DD_API_KEY }},dd-otlp-source=datadog,dd-otel-metric-config=%7B%22resource_attributes_as_tags%22%3A%20true%7D"
          OTEL_SERVICE_NAME: otel-minutes-digest
        run: uv run python scripts/send_digest.py
