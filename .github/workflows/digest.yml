name: Daily Digest

on:
  workflow_run:
    workflows: ["Generate Summaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      summarize_commit_sha:
        description: "Commit SHA written by the summarize workflow (leave blank to diff HEAD~1..HEAD)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read      # needed to download artifacts from the triggering workflow run

concurrency:
  group: "digest"
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0          # full history so SUMMARIZE_COMMIT_SHA~1 is always reachable for git diff

      - name: Download summary commit SHA artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: summarize-commit-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read summary commit SHA
        id: read-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.summarize_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA=$(cat summarize-commit-sha.txt 2>/dev/null | tr -d '[:space:]')
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DISPATCH_SHA" ]; then
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize

      - name: Send daily digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # SHA of the exact commit summarize pushed (empty if nothing was pushed).
          # found=true means this is a workflow_run trigger; found=false means workflow_dispatch.
          SUMMARIZE_COMMIT_SHA: ${{ steps.read-sha.outputs.sha }}
          SUMMARIZE_COMMIT_FOUND: ${{ steps.read-sha.outputs.found }}
        run: uv run python scripts/send_digest.py
