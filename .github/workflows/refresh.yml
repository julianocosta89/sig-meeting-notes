name: Refresh Transcripts

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6 AM UTC, weekdays
  workflow_dispatch:
    inputs:
      since:
        description: 'Fetch since date (YYYY-MM-DD). Defaults to 14 days ago.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: "refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group telemetry

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Fetch new transcripts
        env:
          SINCE: ${{ github.event.inputs.since }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=${{ secrets.DD_API_KEY }},dd-otlp-source=datadog,dd-otel-metric-config=%7B%22resource_attributes_as_tags%22%3A%20true%7D"
          OTEL_SERVICE_NAME: otel-minutes-refresh
        run: |
          if [ -n "$SINCE" ]; then
            uv run python main.py --since "$SINCE"
          else
            uv run python main.py
          fi

      - name: Build site
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=${{ secrets.DD_API_KEY }},dd-otlp-source=datadog,dd-otel-metric-config=%7B%22resource_attributes_as_tags%22%3A%20true%7D"
          OTEL_SERVICE_NAME: otel-minutes-build-site
        run: |
          if [ -f build_site.py ]; then
            uv run python build_site.py
          else
            echo "build_site.py not found yet — skipping site build."
          fi

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
          else
            git commit -m "chore: refresh transcripts $(date -u +%Y-%m-%d)"
            git push
          fi
