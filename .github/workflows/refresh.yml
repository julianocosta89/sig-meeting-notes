name: Refresh Transcripts

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6 AM UTC, weekdays
  workflow_dispatch:
    inputs:
      since:
        description: 'Fetch since date (YYYY-MM-DD). Defaults to 14 days ago.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: "refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Fetch new transcripts
        env:
          SINCE: ${{ github.event.inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then
            uv run python main.py --since "$SINCE"
          else
            uv run python main.py
          fi

      - name: Build site
        run: |
          if [ -f build_site.py ]; then
            uv run python build_site.py
          else
            echo "build_site.py not found yet — skipping site build."
          fi

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
          else
            git commit -m "chore: refresh transcripts $(date -u +%Y-%m-%d)"
            git push
          fi
