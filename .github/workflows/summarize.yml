name: Generate Summaries

on:
  workflow_run:
    workflows: ["Refresh Transcripts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "summarize"
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # v7.3.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize

      - name: Generate summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python generate_summaries.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/content/
          PUSHED_SHA=""
          if git diff --cached --quiet; then
            echo "No new summaries to commit — skipping."
          else
            echo "New summaries detected — rebuilding manifest."
            uv run python build_site.py
            git add docs/manifest.json
            git commit -m "chore: generate meeting summaries $(date -u +%Y-%m-%d)"
            git push
            PUSHED_SHA=$(git rev-parse HEAD)
          fi
          # Write pushed SHA (or empty) so the digest workflow can diff exactly
          # the commit this run produced, preventing duplicate digests on reruns.
          echo "$PUSHED_SHA" > summarize-commit-sha.txt

      - name: Upload summary commit SHA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: summarize-commit-sha
          path: summarize-commit-sha.txt
          retention-days: 1
