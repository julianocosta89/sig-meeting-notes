name: Generate Summaries

on:
  workflow_run:
    workflows: ["Refresh Transcripts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "summarize"
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize

      - name: Generate summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python generate_summaries.py

      - name: Commit changes if any
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/content/
          PUSHED_SHA=""
          if git diff --cached --quiet; then
            echo "No new summaries to commit — skipping."
            # A previous attempt may have already pushed summaries before failing.
            # If HEAD has advanced past the trigger SHA, that prior-attempt commit
            # contains the summaries; report it so the digest is not silently dropped.
            if [ "$(git rev-parse HEAD)" != "$TRIGGER_SHA" ]; then
              PUSHED_SHA=$(git rev-parse HEAD)
              echo "Previous attempt already pushed $PUSHED_SHA — reporting for digest."
            fi
          else
            echo "New summaries detected — rebuilding manifest."
            uv run python build_site.py
            git add docs/manifest.json
            git commit -m "chore: generate meeting summaries $(date -u +%Y-%m-%d)"
            git push
            PUSHED_SHA=$(git rev-parse HEAD)
          fi
          # Write pushed SHA (or empty) so the digest workflow can diff exactly
          # the commit this run produced, preventing duplicate digests on reruns.
          echo "$PUSHED_SHA" > summarize-commit-sha.txt

      - name: Upload summary commit SHA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: summarize-commit-sha
          path: summarize-commit-sha.txt
          retention-days: 1
