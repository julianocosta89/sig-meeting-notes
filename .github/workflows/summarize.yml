name: Generate Summaries

on:
  workflow_run:
    workflows: ["Refresh Transcripts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "summarize"
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize --group telemetry

      - name: Generate summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=${{ secrets.DD_API_KEY }},dd-otlp-source=llmobs,dd-otel-metric-config=%7B%22resource_attributes_as_tags%22%3A%20true%7D"
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: span_only
          OTEL_SEMCONV_STABILITY_OPT_IN: gen_ai_latest_experimental
          OTEL_SERVICE_NAME: otel-minutes-summarize
        run: uv run python generate_summaries.py

      - name: Commit changes if any
        env:
          TRIGGER_SHA: ${{ github.sha }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=${{ secrets.DD_API_KEY }},dd-otlp-source=datadog,dd-otel-metric-config=%7B%22resource_attributes_as_tags%22%3A%20true%7D"
          OTEL_SERVICE_NAME: otel-minutes-build-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/content/
          PUSHED_SHA=""
          if git diff --cached --quiet; then
            echo "No new summaries to commit — skipping."
            # A previous attempt may have already pushed summaries before failing.
            # If HEAD has advanced past the trigger SHA, that prior-attempt commit
            # contains the summaries; report it so the digest is not silently dropped.
            if [ "$(git rev-parse HEAD)" != "$TRIGGER_SHA" ]; then
              PUSHED_SHA=$(git rev-parse HEAD)
              echo "Previous attempt already pushed $PUSHED_SHA — reporting for digest."
            fi
          else
            echo "New summaries detected — rebuilding manifest."
            uv run python build_site.py
            git add docs/manifest.json docs/speakers.json docs/meetings.jsonl
            git commit -m "chore: generate meeting summaries $(date -u +%Y-%m-%d)"
            git push
            PUSHED_SHA=$(git rev-parse HEAD)
          fi
          # Write pushed SHA (or empty) so the digest workflow can diff exactly
          # the commit this run produced, preventing duplicate digests on reruns.
          echo "$PUSHED_SHA" > summarize-commit-sha.txt

      - name: Upload summary commit SHA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: summarize-commit-sha
          path: summarize-commit-sha.txt
          retention-days: 1
