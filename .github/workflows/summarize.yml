name: Generate Summaries

on:
  workflow_run:
    workflows: ["Refresh Transcripts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "summarize"
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group summarize

      - name: Generate summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python generate_summaries.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/content/
          if git diff --cached --quiet; then
            echo "No new summaries to commit — skipping."
          else
            echo "New summaries detected — rebuilding manifest."
            uv run python build_site.py
            git add docs/manifest.json
            git commit -m "chore: generate meeting summaries $(date -u +%Y-%m-%d)"
            git push
          fi
